name: Tests & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten installieren
        run: |
          pip install pytest playwright requests
          python -m playwright install --with-deps chromium
          npm install -g firebase-tools
      - name: Unit-Tests
        run: npm run test:unit
      - name: Browser- und Emulator-Tests
        run: firebase emulators:exec --project demo-wichteln --only auth,firestore "EMULATOR=1 python -m pytest -v tests"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Firebase-Schlüssel aus den Secrets einsetzen
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::Die Secrets FIREBASE_API_KEY und FIREBASE_APP_ID fehlen (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("site/src/config.js")
          s = p.read_text()
          key, app = os.environ["FIREBASE_API_KEY"].strip(), os.environ["FIREBASE_APP_ID"].strip()
          assert re.fullmatch(r"AIza[0-9A-Za-z_-]{35}", key), "FIREBASE_API_KEY hat nicht das erwartete Format"
          assert re.fullmatch(r"\d+:\d+:web:[0-9a-f]+", app), "FIREBASE_APP_ID hat nicht das erwartete Format"
          assert "__FIREBASE_API_KEY__" in s and "__FIREBASE_APP_ID__" in s
          p.write_text(s.replace("__FIREBASE_API_KEY__", key).replace("__FIREBASE_APP_ID__", app))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
